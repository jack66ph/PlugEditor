<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlugEditor — 獨立單檔富文字編輯器</title>

  <link href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css" rel="stylesheet" />
  <style>
    :root {
      --bg-app: #ffffff;
      --bg-toolbar: #f8fafc;
      --bg-toolbar-hover: #e2e8f0;
      --bg-toolbar-active: #dbeafe;
      --bg-editor: #ffffff;
      --bg-modal: #ffffff;
      --bg-input: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-active: #1d4ed8;
      --border-color: #cbd5e1;
      --border-subtle: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #dc2626;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 8px 24px rgba(15, 23, 42, 0.14);
      --toast-bg: #1e293b;
      --toast-text: #f8fafc;
      --scrollbar-thumb: #cbd5e1;
    }

    [data-theme="dark"] {
      --bg-app: #0f172a;
      --bg-toolbar: #1e293b;
      --bg-toolbar-hover: #334155;
      --bg-toolbar-active: #1e3a8a;
      --bg-editor: #0f172a;
      --bg-modal: #1e293b;
      --bg-input: #0f172a;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-active: #93c5fd;
      --border-color: #334155;
      --border-subtle: #283548;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --danger: #f87171;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.45);
      --toast-bg: #f1f5f9;
      --toast-text: #0f172a;
      --scrollbar-thumb: #475569;
    }

    [data-theme="eyecare"] {
      --bg-app: #f3f7ec;
      --bg-toolbar: #e6eedb;
      --bg-toolbar-hover: #d5e2c4;
      --bg-toolbar-active: #c2d9a8;
      --bg-editor: #f7faf0;
      --bg-modal: #f3f7ec;
      --bg-input: #fafcf6;
      --text-primary: #273620;
      --text-secondary: #586c4e;
      --text-active: #2e5e1e;
      --border-color: #bfd0ab;
      --border-subtle: #d6e2c6;
      --accent: #3f7a2c;
      --accent-hover: #2f6120;
      --danger: #b91c1c;
      --shadow-sm: 0 1px 2px rgba(39, 54, 32, 0.08);
      --shadow-md: 0 8px 24px rgba(39, 54, 32, 0.16);
      --toast-bg: #273620;
      --toast-text: #f3f7ec;
      --scrollbar-thumb: #b4c79d;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-app);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    .editor-shell {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--bg-app);
      overflow: visible;
      box-shadow: var(--shadow-sm);
    }

    /* Toolbars Container */
    .toolbars-container {
      display: flex;
      flex-direction: column;
      background: var(--bg-toolbar);
      border-bottom: 1px solid var(--border-color);
      border-top-left-radius: 8px;
      border-top-right-radius: 8px;
    }

    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .toolbar-row:last-child {
      border-bottom: none;
    }

    .toolbar-row.hidden {
      display: none;
    }

    .toolbar-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      padding: 0 4px;
      user-select: none;
      white-space: nowrap;
    }

    .toolbar-spacer {
      flex: 1 1 auto;
    }

    .toolbar-sep {
      width: 1px;
      height: 20px;
      background: var(--border-color);
      margin: 0 3px;
    }

    /* Buttons & Selects */
    .tb-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 28px;
      height: 28px;
      padding: 0 6px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: var(--text-primary);
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
    }

    .tb-btn:hover {
      background: var(--bg-toolbar-hover);
    }

    .tb-btn.active {
      background: var(--bg-toolbar-active);
      color: var(--text-active);
      border-color: rgba(37, 99, 235, 0.25);
    }

    .tb-btn.locked {
      background: var(--accent);
      color: #ffffff;
    }

    .tb-btn svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    .tb-btn.sym-btn {
      min-width: 26px;
      height: 26px;
      padding: 0 5px;
      font-size: 14px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-editor);
    }

    .tb-btn.sym-btn:hover {
      background: var(--bg-toolbar-hover);
      border-color: var(--border-color);
    }

    .tb-btn.switch-btn {
      font-size: 12px;
      padding: 0 8px;
      height: 26px;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      font-weight: 500;
    }

    .tb-btn.switch-btn:hover {
      background: var(--bg-toolbar-active);
    }

    .tb-select {
      height: 28px;
      padding: 0 6px;
      border: 1px solid var(--border-color);
      border-radius: 5px;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 12.5px;
      font-family: inherit;
      cursor: pointer;
      outline: none;
    }

    .tb-select:focus {
      border-color: var(--accent);
    }

    /* Color Picker Popover */
    .color-wrapper {
      position: relative;
      display: inline-flex;
    }

    .color-indicator {
      width: 14px;
      height: 3px;
      border-radius: 1px;
      background: #ef4444;
      margin-top: 1px;
    }

    .color-btn-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1;
      font-weight: 700;
      font-size: 13px;
    }

    .color-popover {
      position: absolute;
      top: 100%;
      left: 0;
      z-index: 100;
      margin-top: 4px;
      padding: 8px;
      background: var(--bg-modal);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow-md);
      display: none;
      width: 196px;
    }

    .color-popover.open {
      display: block;
    }

    .color-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-bottom: 8px;
    }

    .color-swatch {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: 1px solid rgba(128, 128, 128, 0.35);
      cursor: pointer;
      padding: 0;
    }

    .color-swatch:hover {
      transform: scale(1.12);
    }

    .color-custom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
      border-top: 1px solid var(--border-subtle);
      padding-top: 6px;
    }

    .color-custom-row input[type="color"] {
      width: 28px;
      height: 22px;
      padding: 0;
      border: none;
      background: none;
      cursor: pointer;
    }

    /* Quill Editor Area Overrides */
    .editor-area-wrap {
      position: relative;
      background: var(--bg-editor);
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
    }

    .editor-area-wrap.format-painter-active .ql-editor {
      cursor: copy !important;
    }

    .ql-container.ql-snow {
      border: none !important;
      font-family: inherit;
      font-size: 15px;
      color: var(--text-primary);
    }

    .ql-editor {
      min-height: 240px;
      padding: 14px 18px;
      color: var(--text-primary);
      line-height: 1.65;
    }

    .ql-editor.ql-blank::before {
      color: var(--text-secondary);
      font-style: normal;
      opacity: 0.7;
    }

    /* 2 half-width spaces per indent level (2ch) */
    .ql-editor .ql-indent-1:not(li) { padding-left: 2ch !important; }
    .ql-editor .ql-indent-2:not(li) { padding-left: 4ch !important; }
    .ql-editor .ql-indent-3:not(li) { padding-left: 6ch !important; }
    .ql-editor .ql-indent-4:not(li) { padding-left: 8ch !important; }
    .ql-editor .ql-indent-5:not(li) { padding-left: 10ch !important; }
    .ql-editor .ql-indent-6:not(li) { padding-left: 12ch !important; }
    .ql-editor .ql-indent-7:not(li) { padding-left: 14ch !important; }
    .ql-editor .ql-indent-8:not(li) { padding-left: 16ch !important; }

    /* Custom 6-level Bullet List: ⦁ ◦ ▪ ▫ ▴ ▵ */
    .ql-editor ol {
      padding-left: 0;
      counter-reset: list-0 list-1 list-2 list-3 list-4 list-5;
    }

    .ql-editor li {
      list-style-type: none;
      position: relative;
    }

    /* Suppress default Quill list counter to avoid ghosting */
    .ql-editor li > .ql-ui {
      display: none !important;
    }

    .ql-editor li[data-list="bullet"] {
      padding-left: 1.6em;
    }

    .ql-editor li[data-list="bullet"]::before {
      content: '⦁';
      display: inline-block;
      width: 1.4em;
      margin-left: -1.6em;
      text-align: center;
      font-family: "Segoe UI Symbol", "Apple Symbols", "Noto Sans Symbols", sans-serif;
    }

    .ql-editor li[data-list="bullet"].ql-indent-1 { padding-left: calc(2ch + 1.6em) !important; }
    .ql-editor li[data-list="bullet"].ql-indent-1::before { content: '◦'; }

    .ql-editor li[data-list="bullet"].ql-indent-2 { padding-left: calc(4ch + 1.6em) !important; }
    .ql-editor li[data-list="bullet"].ql-indent-2::before { content: '▪'; }

    .ql-editor li[data-list="bullet"].ql-indent-3 { padding-left: calc(6ch + 1.6em) !important; }
    .ql-editor li[data-list="bullet"].ql-indent-3::before { content: '▫'; }

    .ql-editor li[data-list="bullet"].ql-indent-4 { padding-left: calc(8ch + 1.6em) !important; }
    .ql-editor li[data-list="bullet"].ql-indent-4::before { content: '▴'; }

    .ql-editor li[data-list="bullet"].ql-indent-5 { padding-left: calc(10ch + 1.6em) !important; }
    .ql-editor li[data-list="bullet"].ql-indent-5::before { content: '▵'; }

    .ql-editor li[data-list="bullet"].ql-indent-6 { padding-left: calc(12ch + 1.6em) !important; }
    .ql-editor li[data-list="bullet"].ql-indent-6::before { content: '▵'; }

    /* Custom 6-level Hierarchical Ordered List: 1. / 1.1. / 1.1.1. ... */
    .ql-editor li[data-list="ordered"] {
      padding-left: 2.2em;
      counter-increment: list-0;
      counter-reset: list-1 list-2 list-3 list-4 list-5;
    }

    .ql-editor li[data-list="ordered"]::before {
      content: counter(list-0) '. ';
      display: inline-block;
      min-width: 1.8em;
      margin-left: -2.2em;
      margin-right: 0.4em;
      text-align: right;
      white-space: nowrap;
    }

    .ql-editor li[data-list="ordered"].ql-indent-1 {
      padding-left: calc(2ch + 2.8em) !important;
      counter-increment: list-1;
      counter-reset: list-2 list-3 list-4 list-5;
    }
    .ql-editor li[data-list="ordered"].ql-indent-1::before {
      content: counter(list-0) '.' counter(list-1) '. ';
      min-width: 2.4em;
      margin-left: -2.8em;
    }

    .ql-editor li[data-list="ordered"].ql-indent-2 {
      padding-left: calc(4ch + 3.6em) !important;
      counter-increment: list-2;
      counter-reset: list-3 list-4 list-5;
    }
    .ql-editor li[data-list="ordered"].ql-indent-2::before {
      content: counter(list-0) '.' counter(list-1) '.' counter(list-2) '. ';
      min-width: 3.2em;
      margin-left: -3.6em;
    }

    .ql-editor li[data-list="ordered"].ql-indent-3 {
      padding-left: calc(6ch + 4.4em) !important;
      counter-increment: list-3;
      counter-reset: list-4 list-5;
    }
    .ql-editor li[data-list="ordered"].ql-indent-3::before {
      content: counter(list-0) '.' counter(list-1) '.' counter(list-2) '.' counter(list-3) '. ';
      min-width: 4em;
      margin-left: -4.4em;
    }

    .ql-editor li[data-list="ordered"].ql-indent-4 {
      padding-left: calc(8ch + 5.2em) !important;
      counter-increment: list-4;
      counter-reset: list-5;
    }
    .ql-editor li[data-list="ordered"].ql-indent-4::before {
      content: counter(list-0) '.' counter(list-1) '.' counter(list-2) '.' counter(list-3) '.' counter(list-4) '. ';
      min-width: 4.8em;
      margin-left: -5.2em;
    }

    .ql-editor li[data-list="ordered"].ql-indent-5 {
      padding-left: calc(10ch + 6.0em) !important;
      counter-increment: list-5;
    }
    .ql-editor li[data-list="ordered"].ql-indent-5::before {
      content: counter(list-0) '.' counter(list-1) '.' counter(list-2) '.' counter(list-3) '.' counter(list-4) '.' counter(list-5) '. ';
      min-width: 5.6em;
      margin-left: -6.0em;
    }

    /* Settings Full-Screen Page */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.48);
      display: none;
      align-items: stretch;
      justify-content: stretch;
      z-index: 999;
      padding: 5px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-panel {
      background: var(--bg-modal);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: var(--shadow-md);
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-subtle);
      font-weight: 600;
      font-size: 15px;
      flex-shrink: 0;
    }

    .modal-body {
      flex: 1;
      min-height: 0;
      padding: 14px 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-tabs {
      display: flex;
      gap: 4px;
      padding: 8px 16px 0;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-toolbar);
      overflow-x: auto;
      flex-shrink: 0;
    }

    .modal-tab-btn {
      padding: 7px 11px;
      border: 1px solid transparent;
      border-bottom: none;
      border-radius: 6px 6px 0 0;
      background: transparent;
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.12s ease, color 0.12s ease;
    }

    .modal-tab-btn:hover {
      background: var(--bg-toolbar-hover);
      color: var(--text-primary);
    }

    .modal-tab-btn.active {
      background: var(--bg-modal);
      color: var(--accent);
      border-color: var(--border-subtle);
      font-weight: 600;
      position: relative;
      top: 1px;
      padding-bottom: 8px;
    }

    .tab-panel {
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .tab-panel.active {
      display: flex;
    }

    .section-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .section-header-row h4 {
      margin: 0;
    }

    .section-actions {
      display: flex;
      gap: 6px;
    }

    .toolbar-hidden-notice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-toolbar);
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .sym-preview {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 22px;
      padding: 0 4px;
      border-radius: 4px;
      background: var(--bg-toolbar);
      border: 1px solid var(--border-subtle);
      font-weight: 600;
      font-size: 13.5px;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-toolbar);
    }

    .setting-section h4 {
      margin: 0 0 8px 0;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .theme-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .theme-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 10px;
      border: 1.5px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      background: var(--bg-input);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
    }

    .theme-card.active {
      border-color: var(--accent);
      background: var(--bg-toolbar-active);
      color: var(--text-active);
    }

    .sortable-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sortable-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 6px;
    }

    .sortable-grid.symbol-grid {
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }

    .sortable-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      background: var(--bg-input);
      font-size: 13px;
      user-select: none;
    }

    .sortable-item.dragging {
      opacity: 0.45;
      border-style: dashed;
    }

    .sortable-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .drag-handle {
      cursor: grab;
      color: var(--text-secondary);
      font-size: 14px;
      line-height: 1;
      padding: 0 2px;
    }

    .sort-arrows {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .mini-btn {
      padding: 2px 6px;
      font-size: 11px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: var(--bg-toolbar);
      color: var(--text-primary);
      cursor: pointer;
    }

    .mini-btn:hover:not(:disabled) {
      background: var(--bg-toolbar-hover);
    }

    .mini-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-primary {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-danger-outline {
      padding: 6px 12px;
      border: 1px solid var(--danger);
      border-radius: 6px;
      background: transparent;
      color: var(--danger);
      font-size: 13px;
      cursor: pointer;
    }

    .btn-danger-outline:hover {
      background: rgba(220, 38, 38, 0.08);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: var(--toast-bg);
      color: var(--toast-text);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s ease;
      z-index: 1200;
      box-shadow: var(--shadow-md);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Mobile Layout Styles */
    .mobile-toolbar-header {
      display: none;
    }

    .mobile-bottom-bar {
      display: none;
    }

    [data-layout="mobile"] .editor-shell {
      border-radius: 6px;
    }

    [data-layout="mobile"] .toolbars-container {
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
    }

    [data-layout="mobile"] .mobile-toolbar-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-toolbar);
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
    }

    [data-layout="mobile"] .toolbars-container.mobile-collapsed .mobile-toolbar-header {

    }

    .mobile-tb-tabs {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1 1 auto;
      min-width: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .mobile-tb-tabs::-webkit-scrollbar {
      display: none;
    }

    .mobile-tb-tab {
      flex-shrink: 0;
      min-width: 34px;
      height: 32px;
      padding: 0 10px;
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      background: var(--bg-editor);
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.12s ease, color 0.12s ease, border-color 0.12s ease;
    }

    .mobile-tb-tab.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      font-weight: 600;
    }

    .mobile-header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    [data-layout="mobile"] .mobile-header-actions .tb-btn {
      min-width: 32px;
      height: 32px;
    }

    [data-layout="mobile"] .toolbar-row {
      display: none;
    }

    [data-layout="mobile"] .toolbar-row.mobile-active {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 7px 8px;
      gap: 6px;
      border-bottom: none;
    }

    [data-layout="mobile"] .toolbar-row.mobile-active::-webkit-scrollbar {
      display: none;
    }

    [data-layout="mobile"] .toolbar-row.mobile-active .toolbar-label {
      display: none;
    }

    [data-layout="mobile"] .toolbar-row.mobile-active .tb-btn,
    [data-layout="mobile"] .toolbar-row.mobile-active .tb-select {
      flex-shrink: 0;
      height: 36px;
    }

    [data-layout="mobile"] .toolbar-row.mobile-active .tb-btn {
      min-width: 36px;
      padding: 0 8px;
    }

    [data-layout="mobile"] .toolbar-row.mobile-active .tb-btn.sym-btn {
      min-width: 38px;
      font-size: 16px;
      border-radius: 6px;
    }

    [data-layout="mobile"] .toolbar-row.mobile-active .tb-btn.switch-btn {
      padding: 0 10px;
      font-size: 12.5px;
      white-space: nowrap;
      border-radius: 6px;
    }

    [data-layout="mobile"] .toolbar-row.mobile-active .tb-select {
      font-size: 13px;
      padding: 0 8px;
    }

    [data-layout="mobile"] .color-popover.open {
      position: fixed;
      top: auto;
      bottom: 54px;
      left: 50%;
      transform: translateX(-50%);
      width: min(300px, calc(100vw - 24px));
      padding: 12px;
      z-index: 1100;
    }

    [data-layout="mobile"] .color-swatch {
      width: 100%;
      height: 30px;
    }

    [data-layout="mobile"] .editor-area-wrap {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    [data-layout="mobile"] .ql-editor {
      font-size: 16px;
      padding: 12px 14px;
      min-height: 200px;
    }

    [data-layout="mobile"] .mobile-bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      background: var(--bg-toolbar);
      border-top: 1px solid var(--border-subtle);
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 6px;
    }

    .mobile-bottom-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    [data-layout="mobile"] .mobile-bottom-bar .tb-btn {
      min-width: 34px;
      height: 34px;
      padding: 0 7px;
      font-size: 12px;
    }

    [data-layout="mobile"] .mobile-bottom-bar .mobile-copy-pill {
      padding: 0 8px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-editor);
      font-weight: 500;
    }

    [data-layout="mobile"] .modal-backdrop {
      align-items: flex-end;
      padding: 0;
    }

    [data-layout="mobile"] .modal-panel {
      width: 100%;
      max-width: 100%;
      max-height: 92vh;
      border-radius: 14px 14px 0 0;
      border-bottom: none;
    }

    [data-layout="mobile"] .modal-tab-btn {
      padding: 9px 12px;
      font-size: 13px;
    }

    [data-layout="mobile"] .sortable-grid {
      grid-template-columns: 1fr;
    }

    [data-layout="mobile"] .sortable-grid.symbol-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    [data-layout="mobile"] .mini-btn {
      width: 30px;
      height: 30px;
    }

    [data-layout="mobile"] .theme-options {
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    [data-layout="mobile"] .theme-card {
      padding: 8px 4px;
      font-size: 12px;
    }

    @media (max-width: 520px) {
      .sortable-grid {
        grid-template-columns: 1fr;
      }
      .sortable-grid.symbol-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .theme-options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="editor-shell" id="editorShell">
    <div class="toolbars-container" id="toolbarsContainer"></div>
    <div class="editor-area-wrap" id="editorAreaWrap">
      <div id="quillEditor"></div>
    </div>
    <div class="mobile-bottom-bar" id="mobileBottomBar"></div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-backdrop" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-panel">
      <div class="modal-header">
        <span id="settingsTitle">編輯器設定與工具列自訂</span>
        <button type="button" class="tb-btn" id="closeSettingsBtn" title="關閉">✕</button>
      </div>
      <div class="modal-tabs" id="settingsTabs" role="tablist" aria-label="設定分頁">
        <button type="button" class="modal-tab-btn active" role="tab" aria-selected="true" data-settings-tab="general">一般設定</button>
      </div>
      <div class="modal-body" id="settingsModalBody">
        <div class="tab-panel active" role="tabpanel" data-tab-panel="general">
          <div class="setting-section">
            <h4>外觀模式</h4>
            <div class="theme-options" id="themeOptions">
              <button type="button" class="theme-card" data-theme-val="light">☀️ 白天模式</button>
              <button type="button" class="theme-card" data-theme-val="dark">🌙 黑夜模式</button>
              <button type="button" class="theme-card" data-theme-val="eyecare">🌿 護眼模式</button>
            </div>
          </div>

          <div class="setting-section">
            <h4>版面模式</h4>
            <div class="theme-options" id="layoutOptions">
              <button type="button" class="theme-card" data-layout-val="auto">🔄 自動偵測</button>
              <button type="button" class="theme-card" data-layout-val="desktop">💻 桌面版面</button>
              <button type="button" class="theme-card" data-layout-val="mobile">📱 手機版面</button>
            </div>
          </div>

          <div class="setting-section">
            <h4>工具列顯示與排列順序（可拖曳或使用上下鍵）</h4>
            <div class="sortable-list" id="toolbarOrderList"></div>
          </div>

          <div class="setting-section" style="font-size:11.5px; color:var(--text-secondary); border-top:1px solid var(--border-subtle); padding-top:10px;">
            核心編輯器採用 <a href="https://github.com/slab/quill" target="_blank" rel="noopener noreferrer" style="color:var(--accent);">Quill 2</a>（BSD-3-Clause 授權；Copyright &copy; 2017–2024 Slab, 2014 Jason Chen, 2013 salesforce.com）。
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-danger-outline" id="resetSettingsBtn">一鍵復原預設</button>
        <button type="button" class="btn-primary" id="doneSettingsBtn">完成</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'plugeditor_config_v1';

      // =========================================================================
      // 1. Symbol & Format Definitions
      // =========================================================================
      const ZH_PUNCTUATION = [
        '，', '、', '。', '‧', '；', '：', '？', '！', '…', '—',
        '（', '）', '【', '】', '《', '》', '「', '」', '『', '』'
      ];
      const EN_PUNCTUATION = [',', '.', '?', '!', '-', '"', "'", ';'];
      const OTHER_SYMBOLS = ['↑', '↓', '←', '→', '↖', '↗', '↙', '↘', '＼', '／', '＋', '－', '×', '÷', '℃'];
      const BOPOMOFO_SYMBOLS = [
        'ㄅ', 'ㄆ', 'ㄇ', 'ㄈ', 'ㄉ', 'ㄊ', 'ㄋ', 'ㄌ', 'ㄍ', 'ㄎ', 'ㄏ',
        'ㄐ', 'ㄑ', 'ㄒ', 'ㄓ', 'ㄔ', 'ㄕ', 'ㄖ', 'ㄗ', 'ㄘ', 'ㄙ',
        'ㄧ', 'ㄨ', 'ㄩ',
        'ㄚ', 'ㄛ', 'ㄜ', 'ㄝ', 'ㄞ', 'ㄟ', 'ㄠ', 'ㄡ', 'ㄢ', 'ㄣ', 'ㄤ', 'ㄥ', 'ㄦ',
        'ˊ', 'ˇ', 'ˋ', '˙'
      ];

      const BULLET_CHARS = ['⦁', '◦', '▪', '▫', '▴', '▵'];

      const FONT_FAMILIES = [
        { label: '預設字型', value: '' },
        { label: '微軟正黑體', value: '"Microsoft JhengHei", sans-serif' },
        { label: '新細明體', value: '"PMingLiU", serif' },
        { label: '標楷體', value: '"DFKai-SB", "BiauKai", serif' },
        { label: '思源黑體', value: '"Noto Sans TC", sans-serif' },
        { label: 'Arial', value: 'Arial, sans-serif' },
        { label: 'Times New Roman', value: '"Times New Roman", serif' },
        { label: 'Courier New', value: '"Courier New", monospace' },
        { label: 'Georgia', value: 'Georgia, serif' }
      ];

      const FONT_SIZES = [
        { label: '預設大小', value: '' },
        { label: '12px', value: '12px' },
        { label: '14px', value: '14px' },
        { label: '16px', value: '16px' },
        { label: '18px', value: '18px' },
        { label: '20px', value: '20px' },
        { label: '24px', value: '24px' },
        { label: '28px', value: '28px' },
        { label: '32px', value: '32px' },
        { label: '36px', value: '36px' }
      ];

      const COLOR_PALETTE = [
        '#000000', '#334155', '#64748b', '#94a3b8', '#ef4444', '#f97316', '#f59e0b',
        '#eab308', '#84cc16', '#22c55e', '#10b981', '#06b6d4', '#3b82f6', '#6366f1',
        '#8b5cf6', '#a855f7', '#d946ef', '#ec4899', '#881337', '#7c2d12', '#ffffff'
      ];

      const TOOLBAR_META = {
        basic: { label: '基本排版工具列', tabLabel: '基本排版' },
        zhPunct: { label: '中文標點符號', tabLabel: '中文標點' },
        enPunct: { label: '英文標點符號', tabLabel: '英文標點' },
        otherSymbols: { label: '其他符號', tabLabel: '其他符號' },
        bopomofo: { label: '注音符號', tabLabel: '注音符號' }
      };

      const BASIC_ITEM_META = {
        bold: { label: '粗體' },
        italic: { label: '斜體' },
        underline: { label: '底線' },
        font: { label: '字型' },
        size: { label: '字體大小' },
        color: { label: '文字顏色' },
        clean: { label: '清除格式' },
        bullet: { label: '符號清單' },
        ordered: { label: '數字清單' },
        indent: { label: '增加縮排' },
        outdent: { label: '減少縮排' },
        painter: { label: '複製格式' },
        cut: { label: '剪下' },
        copy: { label: '複製' },
        paste: { label: '貼上' },
        undo: { label: '上一步' },
        redo: { label: '下一步' },
        copyText: { label: '複製純文字' },
        copyRich: { label: '複製富文字' },
        copyMd: { label: '複製 Markdown' }
      };

      const TOOLBAR_ITEM_SCHEMAS = [
        { id: 'basic', configKey: 'basicItems', meta: BASIC_ITEM_META, isSymbol: false },
        { id: 'zhPunct', configKey: 'zhPunctItems', meta: null, isSymbol: true },
        { id: 'enPunct', configKey: 'enPunctItems', meta: null, isSymbol: true },
        { id: 'otherSymbols', configKey: 'otherSymbolsItems', meta: null, isSymbol: true },
        { id: 'bopomofo', configKey: 'bopomofoItems', meta: null, isSymbol: true }
      ];

      const DEFAULT_CONFIG = {
        theme: 'light',
        layoutMode: 'auto',
        toolbars: [
          { id: 'basic', enabled: true },
          { id: 'zhPunct', enabled: false },
          { id: 'enPunct', enabled: false },
          { id: 'otherSymbols', enabled: false },
          { id: 'bopomofo', enabled: false }
        ],
        basicItems: [
          { id: 'bold', enabled: true },
          { id: 'italic', enabled: true },
          { id: 'underline', enabled: true },
          { id: 'font', enabled: true },
          { id: 'size', enabled: true },
          { id: 'color', enabled: true },
          { id: 'clean', enabled: true },
          { id: 'bullet', enabled: true },
          { id: 'ordered', enabled: true },
          { id: 'indent', enabled: true },
          { id: 'outdent', enabled: true },
          { id: 'painter', enabled: true },
          { id: 'cut', enabled: true },
          { id: 'copy', enabled: true },
          { id: 'paste', enabled: true },
          { id: 'undo', enabled: true },
          { id: 'redo', enabled: true },
          { id: 'copyText', enabled: true },
          { id: 'copyRich', enabled: true },
          { id: 'copyMd', enabled: true }
        ],
        zhPunctItems: ZH_PUNCTUATION.map((sym) => ({ id: sym, enabled: true })),
        enPunctItems: EN_PUNCTUATION.map((sym) => ({ id: sym, enabled: true })),
        otherSymbolsItems: OTHER_SYMBOLS.map((sym) => ({ id: sym, enabled: true })),
        bopomofoItems: BOPOMOFO_SYMBOLS.map((sym) => ({ id: sym, enabled: true }))
      };

      // =========================================================================
      // 2. Config Persistence (with safe fallback for sandboxed iframes)
      // =========================================================================
      function cloneDefaultConfig() {
        return JSON.parse(JSON.stringify(DEFAULT_CONFIG));
      }

      function mergeItemList(savedList, defaultList) {
        if (!Array.isArray(savedList)) {
          return defaultList.map((item) => ({ ...item }));
        }
        const validIds = new Set(defaultList.map((t) => t.id));
        const merged = [];
        const seen = new Set();
        savedList.forEach((item) => {
          if (item && validIds.has(item.id) && !seen.has(item.id)) {
            merged.push({ id: item.id, enabled: Boolean(item.enabled) });
            seen.add(item.id);
          }
        });
        defaultList.forEach((item) => {
          if (!seen.has(item.id)) merged.push({ ...item });
        });
        return merged;
      }

      function mergeConfig(saved) {
        const def = cloneDefaultConfig();
        if (!saved || typeof saved !== 'object') return def;

        if (['light', 'dark', 'eyecare'].includes(saved.theme)) {
          def.theme = saved.theme;
        }
        if (['auto', 'desktop', 'mobile'].includes(saved.layoutMode)) {
          def.layoutMode = saved.layoutMode;
        }

        def.toolbars = mergeItemList(saved.toolbars, DEFAULT_CONFIG.toolbars);
        TOOLBAR_ITEM_SCHEMAS.forEach(({ configKey }) => {
          def[configKey] = mergeItemList(saved[configKey], DEFAULT_CONFIG[configKey]);
        });

        return def;
      }

      function loadConfig() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return cloneDefaultConfig();
          return mergeConfig(JSON.parse(raw));
        } catch (e) {
          return cloneDefaultConfig();
        }
      }

      function saveConfig() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
        } catch (e) {
          // Ignore storage errors in restricted iframes
        }
      }

      let config = loadConfig();

      // Apply URL query overrides if provided (?theme=dark&layout=mobile)
      const urlParams = new URLSearchParams(window.location.search);
      if (['light', 'dark', 'eyecare'].includes(urlParams.get('theme'))) {
        config.theme = urlParams.get('theme');
      }
      if (['auto', 'desktop', 'mobile'].includes(urlParams.get('layout'))) {
        config.layoutMode = urlParams.get('layout');
      }

      function applyTheme(theme) {
        if (theme === 'light') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', theme);
        }
        document.querySelectorAll('#themeOptions .theme-card').forEach((card) => {
          card.classList.toggle('active', card.dataset.themeVal === theme);
        });
      }

      let currentResolvedMobile = null;
      let mobileActiveToolbarId = 'basic';
      let mobileToolbarCollapsed = false;

      function resolveIsMobile() {
        if (config.layoutMode === 'mobile') return true;
        if (config.layoutMode === 'desktop') return false;
        return window.innerWidth <= 640;
      }

      function applyLayout(forceRerender) {
        const isMobile = resolveIsMobile();
        document.documentElement.setAttribute('data-layout', isMobile ? 'mobile' : 'desktop');
        document.querySelectorAll('#layoutOptions .theme-card').forEach((card) => {
          card.classList.toggle('active', card.dataset.layoutVal === config.layoutMode);
        });
        const changed = currentResolvedMobile !== isMobile;
        currentResolvedMobile = isMobile;
        if (changed && forceRerender && typeof renderToolbars === 'function') {
          renderToolbars();
        }
      }

      applyTheme(config.theme);
      applyLayout(false);

      // =========================================================================
      // 3. Quill 2 Initialization with Style Attributors
      // =========================================================================
      const FontStyle = Quill.import('attributors/style/font');
      FontStyle.whitelist = FONT_FAMILIES.map((f) => f.value).filter(Boolean);
      Quill.register(FontStyle, true);

      const SizeStyle = Quill.import('attributors/style/size');
      SizeStyle.whitelist = FONT_SIZES.map((s) => s.value).filter(Boolean);
      Quill.register(SizeStyle, true);

      const quill = new Quill('#quillEditor', {
        theme: 'snow',
        placeholder: urlParams.get('placeholder') || '請在此輸入內容...',
        modules: {
          toolbar: false,
          history: {
            delay: 500,
            maxStack: 200,
            userOnly: true
          }
        }
      });

      // =========================================================================
      // 4. Toast Helper
      // =========================================================================
      const toastEl = document.getElementById('toast');
      let toastTimer = null;
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.classList.remove('show');
        }, 2000);
      }

      // =========================================================================
      // 5. Format Painter (Word-style: 1 click = once, double click = locked)
      // =========================================================================
      let painterMode = 'off'; // 'off' | 'once' | 'locked'
      let painterFormats = null;
      let lastPainterClickTime = 0;
      const editorAreaWrap = document.getElementById('editorAreaWrap');

      function captureSelectionFormats() {
        const range = quill.getSelection();
        if (!range) return null;
        const fmt = quill.getFormat(range);
        const captured = {};
        ['bold', 'italic', 'underline', 'color', 'background', 'font', 'size'].forEach((k) => {
          if (fmt[k] !== undefined) captured[k] = fmt[k];
        });
        return captured;
      }

      function applyPainterFormatsToSelection() {
        if (painterMode === 'off' || !painterFormats) return;
        const range = quill.getSelection();
        if (!range) return;

        // Clear inline formats first, then apply captured formats
        ['bold', 'italic', 'underline', 'color', 'background', 'font', 'size'].forEach((k) => {
          quill.format(k, painterFormats[k] !== undefined ? painterFormats[k] : false, 'user');
        });

        if (painterMode === 'once') {
          deactivatePainter();
        }
      }

      function deactivatePainter() {
        painterMode = 'off';
        painterFormats = null;
        editorAreaWrap.classList.remove('format-painter-active');
        updateToolbarActiveStates();
      }

      function handlePainterClick() {
        const now = Date.now();
        const isDouble = now - lastPainterClickTime < 350;
        lastPainterClickTime = now;

        if (isDouble) {
          if (painterMode === 'off') {
            painterFormats = captureSelectionFormats();
          }
          if (painterFormats) {
            painterMode = 'locked';
            editorAreaWrap.classList.add('format-painter-active');
            showToast('複製格式已鎖定（按 Esc 或再點一次取消）');
          }
        } else {
          if (painterMode !== 'off') {
            deactivatePainter();
          } else {
            const captured = captureSelectionFormats();
            if (!captured) {
              showToast('請先將游標放在要複製格式的文字上');
              return;
            }
            painterFormats = captured;
            painterMode = 'once';
            editorAreaWrap.classList.add('format-painter-active');
            showToast('請反白或點擊目標文字以套用格式');
          }
        }
        updateToolbarActiveStates();
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && painterMode !== 'off') {
          deactivatePainter();
        }
      });

      quill.root.addEventListener('mouseup', () => {
        if (painterMode !== 'off') {
          setTimeout(applyPainterFormatsToSelection, 0);
        }
      });

      // =========================================================================
      // 6. Export / Copy Converters (Plain Text, Rich Text, Markdown)
      // =========================================================================
      function getHierarchicalCounters(liElements) {
        const counters = [0, 0, 0, 0, 0, 0];
        const results = new Map();

        liElements.forEach((li) => {
          const type = li.getAttribute('data-list');
          const levelMatch = li.className.match(/ql-indent-(\d+)/);
          const level = levelMatch ? Math.min(5, parseInt(levelMatch[1], 10)) : 0;

          if (type === 'ordered') {
            counters[level] += 1;
            for (let i = level + 1; i < counters.length; i++) counters[i] = 0;
            const label = counters.slice(0, level + 1).join('.') + '.';
            results.set(li, { type: 'ordered', level, label });
          } else {
            for (let i = 0; i < counters.length; i++) counters[i] = 0;
            const sym = BULLET_CHARS[Math.min(level, BULLET_CHARS.length - 1)];
            results.set(li, { type: 'bullet', level, label: sym });
          }
        });
        return results;
      }

      function getPlainTextContent() {
        const root = quill.root;
        const lines = [];
        const allLis = Array.from(root.querySelectorAll('li'));
        const listMetaMap = getHierarchicalCounters(allLis);

        Array.from(root.children).forEach((block) => {
          if (block.tagName === 'OL' || block.tagName === 'UL') {
            Array.from(block.children).forEach((li) => {
              if (li.tagName !== 'LI') return;
              const meta = listMetaMap.get(li) || { level: 0, label: '⦁' };
              const indent = '  '.repeat(meta.level);
              const text = (li.innerText || li.textContent || '').replace(/\u00a0/g, ' ');
              lines.push(`${indent}${meta.label} ${text}`);
            });
          } else {
            const levelMatch = block.className.match(/ql-indent-(\d+)/);
            const level = levelMatch ? parseInt(levelMatch[1], 10) : 0;
            const indent = '  '.repeat(level);
            const text = (block.innerText || block.textContent || '').replace(/\u00a0/g, ' ');
            // Quill uses <p><br></p> for empty lines
            lines.push(text === '\n' ? '' : `${indent}${text}`);
          }
        });

        return lines.join('\n');
      }

      function serializeInlineMarkdown(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          return node.textContent.replace(/\u00a0/g, ' ');
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return '';

        const tag = node.tagName.toLowerCase();
        if (tag === 'br') return '';

        const inner = Array.from(node.childNodes).map(serializeInlineMarkdown).join('');
        if (!inner) return '';

        if (tag === 'strong' || tag === 'b') return `**${inner}**`;
        if (tag === 'em' || tag === 'i') return `*${inner}*`;
        if (tag === 'u') return `<u>${inner}</u>`;
        if (tag === 's' || tag === 'del') return `~~${inner}~~`;
        if (tag === 'a') return `[${inner}](${node.getAttribute('href') || ''})`;
        if (tag === 'code') return `\`${inner}\``;
        return inner;
      }

      function getMarkdownContent() {
        const root = quill.root;
        const lines = [];
        const allLis = Array.from(root.querySelectorAll('li'));
        const listMetaMap = getHierarchicalCounters(allLis);

        Array.from(root.children).forEach((block) => {
          if (block.tagName === 'OL' || block.tagName === 'UL') {
            Array.from(block.children).forEach((li) => {
              if (li.tagName !== 'LI') return;
              const meta = listMetaMap.get(li) || { type: 'bullet', level: 0, label: '-' };
              const indent = '  '.repeat(meta.level);
              const mdText = Array.from(li.childNodes).map(serializeInlineMarkdown).join('');
              const prefix = meta.type === 'ordered' ? `${meta.level === 0 ? meta.label : '1.'}` : '-';
              lines.push(`${indent}${prefix} ${mdText}`);
            });
          } else {
            const levelMatch = block.className.match(/ql-indent-(\d+)/);
            const level = levelMatch ? parseInt(levelMatch[1], 10) : 0;
            const indent = '  '.repeat(level);
            const mdText = Array.from(block.childNodes).map(serializeInlineMarkdown).join('');
            lines.push(mdText ? `${indent}${mdText}` : '');
          }
        });

        return lines.join('\n');
      }

      // ---- Rich HTML export (Word / Google Docs / Outlook friendly) ----
      // Word does not render CSS pseudo-elements (::before) nor class-based styles,
      // so we serialize Quill's DOM into self-contained semantic HTML:
      //   - real nested <ul>/<ol> lists (Word converts them to native lists)
      //   - <b>/<i>/<u>/<s> tags for emphasis
      //   - inline styles with hex colors and pt font sizes
      function escapeHtml(str) {
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function cssColorToHex(value) {
        if (!value) return '';
        const m = value.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
        if (!m) return value;
        return '#' + [m[1], m[2], m[3]].map((n) => parseInt(n, 10).toString(16).padStart(2, '0')).join('');
      }

      function cssSizeToPt(value) {
        if (!value) return '';
        const m = value.match(/^([\d.]+)px$/i);
        if (!m) return value;
        return `${Math.round(parseFloat(m[1]) * 0.75 * 10) / 10}pt`;
      }

      function serializeInlineForExport(node) {
        if (node.nodeType === Node.TEXT_NODE) {
          // Preserve consecutive spaces (Quill uses white-space: pre-wrap)
          return escapeHtml(node.textContent.replace(/\u00a0/g, ' ')).replace(/ {2}/g, ' &nbsp;');
        }
        if (node.nodeType !== Node.ELEMENT_NODE) return '';
        if (node.classList.contains('ql-ui')) return '';

        const tag = node.tagName.toLowerCase();
        if (tag === 'br') return '<br>';

        let inner = Array.from(node.childNodes).map(serializeInlineForExport).join('');
        if (!inner) return '';

        // Inline styles (color / background / font / size)
        const styles = [];
        const st = node.style;
        if (st.color) styles.push(`color:${cssColorToHex(st.color)}`);
        if (st.backgroundColor) styles.push(`background:${cssColorToHex(st.backgroundColor)}`);
        if (st.fontFamily) styles.push(`font-family:${st.fontFamily.replace(/"/g, "'")}`);
        if (st.fontSize) styles.push(`font-size:${cssSizeToPt(st.fontSize)}`);
        if (styles.length) inner = `<span style="${styles.join(';')}">${inner}</span>`;
        if (st.color) inner = `<font color="${cssColorToHex(st.color)}">${inner}</font>`;

        switch (tag) {
          case 'strong':
          case 'b':
            return `<b>${inner}</b>`;
          case 'em':
          case 'i':
            return `<i>${inner}</i>`;
          case 'u':
            return `<u>${inner}</u>`;
          case 's':
          case 'del':
          case 'strike':
            return `<s>${inner}</s>`;
          case 'sub':
          case 'sup':
          case 'code':
            return `<${tag}>${inner}</${tag}>`;
          case 'a':
            return `<a href="${escapeHtml(node.getAttribute('href') || '')}">${inner}</a>`;
          default:
            return inner;
        }
      }

      function getBlockInnerHtml(block) {
        const html = Array.from(block.childNodes).map(serializeInlineForExport).join('');
        // Quill represents an empty line as <p><br></p>
        return html === '' || html === '<br>' ? '&nbsp;' : html;
      }

      function getIndentLevel(el) {
        const m = (el.className || '').match(/ql-indent-(\d+)/);
        return m ? parseInt(m[1], 10) : 0;
      }

      function getAlignStyle(el) {
        const m = (el.className || '').match(/ql-align-(center|right|justify)/);
        return m ? `text-align:${m[1]};` : '';
      }

      function serializeListItems(lis) {
        // Rebuild Quill 2's flat <ol><li data-list class="ql-indent-N"> into nested lists
        let html = '';
        const stack = []; // stack[level] = 'ul' | 'ol'
        // Word's default multilevel numbering: 1. → a. → i. → 1. ...
        const OL_TYPES = [
          { attr: '1', css: 'decimal' },
          { attr: 'a', css: 'lower-alpha' },
          { attr: 'i', css: 'lower-roman' }
        ];
        const listOpen = (type) => {
          if (type === 'ol') {
            const t = OL_TYPES[stack.length % OL_TYPES.length];
            return `<ol type="${t.attr}" style="list-style-type:${t.css};margin-top:0;margin-bottom:0;">`;
          }
          return '<ul style="margin-top:0;margin-bottom:0;">';
        };

        lis.forEach((li) => {
          const type = li.getAttribute('data-list') === 'ordered' ? 'ol' : 'ul';
          const level = Math.min(getIndentLevel(li), 8);

          // Close lists deeper than the current level
          while (stack.length - 1 > level) {
            html += `</li></${stack.pop()}>`;
          }
          // Same level but different list type -> close it and start a new one
          if (stack.length - 1 === level && stack[level] !== type) {
            html += `</li></${stack.pop()}>`;
          }
          if (stack.length - 1 === level) {
            html += '</li>';
          }
          // Open lists until the current level is reached (nested inside the open <li>)
          while (stack.length - 1 < level) {
            const isTarget = stack.length === level;
            const openType = isTarget ? type : (stack[stack.length - 1] || type);
            html += listOpen(openType);
            stack.push(openType);
            if (!isTarget) html += '<li style="list-style-type:none;">';
          }
          html += `<li style="${getAlignStyle(li)}">${getBlockInnerHtml(li)}`;
        });

        while (stack.length) {
          html += `</li></${stack.pop()}>`;
        }
        return html;
      }

      function getRichHtmlContent() {
        const parts = [];
        Array.from(quill.root.children).forEach((block) => {
          const tag = block.tagName;
          if (tag === 'OL' || tag === 'UL') {
            parts.push(serializeListItems(Array.from(block.children).filter((el) => el.tagName === 'LI')));
            return;
          }
          const level = getIndentLevel(block);
          const style = `margin:0;${level ? `margin-left:${level * 2}em;` : ''}${getAlignStyle(block)}`;
          const outTag = /^H[1-6]$/.test(tag) ? tag.toLowerCase() : tag === 'BLOCKQUOTE' ? 'blockquote' : tag === 'PRE' ? 'pre' : 'p';
          parts.push(`<${outTag} style="${style}">${getBlockInnerHtml(block)}</${outTag}>`);
        });
        return parts.join('');
      }

      async function copyTextToClipboard(text, successMsg) {
        try {
          await navigator.clipboard.writeText(text);
          showToast(successMsg);
        } catch (e) {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          showToast(successMsg);
        }
      }

      async function copyRichToClipboard() {
        const html = getRichHtmlContent();
        const plain = getPlainTextContent();

        // Primary: synchronous copy event + clipboardData.setData().
        // Chromium's async Clipboard API (ClipboardItem) sanitizes text/html and
        // drops inline styles, which made Word lose colors / fonts / indents.
        // setData() inside a copy event writes the HTML as-is.
        let written = false;
        const onCopy = (e) => {
          if (!e.clipboardData) return;
          e.clipboardData.setData('text/html', html);
          e.clipboardData.setData('text/plain', plain);
          e.preventDefault();
          e.stopImmediatePropagation(); // keep Quill's own copy handler out of it
          written = true;
        };
        document.addEventListener('copy', onCopy, true);
        try {
          document.execCommand('copy');
        } catch (e) {
          // ignore, fall back below
        } finally {
          document.removeEventListener('copy', onCopy, true);
        }
        if (written) {
          showToast('已複製富文字到剪貼簿');
          return;
        }

        // Fallback: async Clipboard API
        try {
          if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
            const item = new ClipboardItem({
              'text/html': new Blob([html], { type: 'text/html' }),
              'text/plain': new Blob([plain], { type: 'text/plain' })
            });
            await navigator.clipboard.write([item]);
            showToast('已複製富文字到剪貼簿');
            return;
          }
        } catch (e) {
          // ignore
        }
        showToast('複製失敗，請改用 Ctrl+C');
      }

        if (range && range.length > 0) {
          quill.deleteText(index, range.length, 'user');
        }
        quill.insertText(index, sym, 'user');
        quill.setSelection(index + sym.length, 0, 'silent');
