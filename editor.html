            break;
          case 'outdent':
            btn.title = '減少縮排';
            btn.innerHTML = ICONS.outdent;
            btn.addEventListener('click', () => {
              quill.focus();
              quill.format('indent', '-1', 'user');
            });
            break;
          case 'painter':
            btn.title = '複製格式（單擊套用一次，雙擊鎖定連續套用）';
            btn.innerHTML = ICONS.painter;
            btn.addEventListener('click', handlePainterClick);
            break;
          case 'cut':
            btn.title = '剪下';
            btn.innerHTML = ICONS.cut;
            btn.addEventListener('click', async () => {
              quill.focus();
              const range = quill.getSelection();
              if (!range || range.length === 0) return;
              const selectedText = quill.getText(range.index, range.length);
              await copyTextToClipboard(selectedText, '已剪下選取文字');
              quill.deleteText(range.index, range.length, 'user');
            });
            break;
          case 'copy':
            btn.title = '複製';
            btn.innerHTML = ICONS.copy;
            btn.addEventListener('click', async () => {
              quill.focus();
              const range = quill.getSelection();
              if (!range || range.length === 0) return;
              const selectedText = quill.getText(range.index, range.length);
              await copyTextToClipboard(selectedText, '已複製選取文字');
            });
            break;
          case 'paste':
            btn.title = '貼上';
            btn.innerHTML = ICONS.paste;
            btn.addEventListener('click', async () => {
              quill.focus();
              try {
                const text = await navigator.clipboard.readText();
                if (text) insertSymbol(text);
              } catch (e) {
                showToast('瀏覽器限制按鈕讀取剪貼簿，請使用 Ctrl+V 貼上');
              }
            });
            break;
          case 'undo':
            btn.title = '上一步 (Ctrl+Z)';
            btn.innerHTML = ICONS.undo;
            btn.addEventListener('click', () => {
              quill.history.undo();
            });
            break;
          case 'redo':
            btn.title = '下一步 (Ctrl+Y)';
            btn.innerHTML = ICONS.redo;
            btn.addEventListener('click', () => {
              quill.history.redo();
            });
            break;
          case 'copyText':
            btn.title = '複製為純文字（含兩格空白縮排與清單符號）';
            btn.textContent = '純文字';
            btn.addEventListener('click', () => {
              copyTextToClipboard(getPlainTextContent(), '已複製純文字到剪貼簿');
            });
            break;
          case 'copyRich':
            btn.title = '複製為富文字（HTML 格式）';
            btn.textContent = '富文字';
            btn.addEventListener('click', copyRichToClipboard);
            break;
          case 'copyMd':
            btn.title = '複製為 Markdown 格式';
            btn.textContent = 'MD';
            btn.addEventListener('click', () => {
              copyTextToClipboard(getMarkdownContent(), '已複製 Markdown 到剪貼簿');
            });
            break;
        }

        basicControlRefs[id] = btn;
        return btn;
      }

      function updateToolbarActiveStates() {
        const range = quill.getSelection();
        const fmt = range ? quill.getFormat(range) : {};

        if (basicControlRefs.bold) basicControlRefs.bold.classList.toggle('active', Boolean(fmt.bold));
        if (basicControlRefs.italic) basicControlRefs.italic.classList.toggle('active', Boolean(fmt.italic));
        if (basicControlRefs.underline) basicControlRefs.underline.classList.toggle('active', Boolean(fmt.underline));
        if (basicControlRefs.bullet) basicControlRefs.bullet.classList.toggle('active', fmt.list === 'bullet');
        if (basicControlRefs.ordered) basicControlRefs.ordered.classList.toggle('active', fmt.list === 'ordered');

        if (basicControlRefs.font) basicControlRefs.font.value = fmt.font || '';
        if (basicControlRefs.size) basicControlRefs.size.value = fmt.size || '';

        const ind = document.getElementById('colorIndicator');
        if (ind) ind.style.background = fmt.color || '#ef4444';

        if (basicControlRefs.painter) {
          basicControlRefs.painter.classList.toggle('active', painterMode === 'once');
          basicControlRefs.painter.classList.toggle('locked', painterMode === 'locked');
        }
      }

      // =========================================================================
      // 9. Render Toolbars Dynamically Based on User Config
      // =========================================================================
      const toolbarsContainer = document.getElementById('toolbarsContainer');
      const mobileBottomBar = document.getElementById('mobileBottomBar');

      function switchPunctuationBar(fromId, toId) {
        config.toolbars.forEach((tb) => {
          if (tb.id === fromId) tb.enabled = false;
          if (tb.id === toId) tb.enabled = true;
        });
        mobileActiveToolbarId = toId;
        mobileToolbarCollapsed = false;
        saveConfig();
        renderToolbars();
        renderSettingsLists();
      }

      function renderSymbolRow(id, label, items, switchTarget) {
        const row = document.createElement('div');
        row.className = 'toolbar-row';
        row.dataset.toolbarId = id;

        const lbl = document.createElement('span');
        lbl.className = 'toolbar-label';
        lbl.textContent = label;
        row.appendChild(lbl);

        items.forEach((item) => {
          if (!item.enabled) return;
          const sym = item.id;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'tb-btn sym-btn';
          btn.textContent = sym;
          btn.title = `插入「${sym}」`;
          btn.addEventListener('click', () => insertSymbol(sym));
          row.appendChild(btn);
        });

        if (switchTarget) {
          const swBtn = document.createElement('button');
          swBtn.type = 'button';
          swBtn.className = 'tb-btn switch-btn';
          swBtn.textContent = switchTarget.btnText;
          swBtn.title = `切換為${TOOLBAR_META[switchTarget.to].label}`;
          swBtn.addEventListener('click', () => switchPunctuationBar(id, switchTarget.to));
          row.appendChild(swBtn);
        }

        return row;
      }

      function renderMobileBottomBar() {
        mobileBottomBar.innerHTML = '';
        if (!currentResolvedMobile) return;

        const leftGroup = document.createElement('div');
        leftGroup.className = 'mobile-bottom-group';

        ['undo', 'redo', 'outdent', 'indent'].forEach((id) => {
          const btn = createBasicItemElement(id);
          leftGroup.appendChild(btn);
        });

        const rightGroup = document.createElement('div');
        rightGroup.className = 'mobile-bottom-group';

        [
          { label: '純文字', handler: copyPlainText, title: '複製純文字' },
          { label: '富文字', handler: copyRichHtml, title: '複製富文字' },
          { label: 'MD', handler: copyMarkdown, title: '複製 Markdown' }
        ].forEach(({ label, handler, title }) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'tb-btn mobile-copy-pill';
          btn.textContent = label;
          btn.title = title;
          btn.addEventListener('click', handler);
          rightGroup.appendChild(btn);
        });

        mobileBottomBar.appendChild(leftGroup);
        mobileBottomBar.appendChild(rightGroup);
      }

      function buildMobileTabDefs() {
        const zhEnabled = Boolean(config.toolbars.find((t) => t.id === 'zhPunct')?.enabled);
        const enEnabled = Boolean(config.toolbars.find((t) => t.id === 'enPunct')?.enabled);
        const punctDefaultId = enEnabled && !zhEnabled ? 'enPunct' : 'zhPunct';

        const tabs = [];
        let punctAdded = false;

        config.toolbars.forEach((tb) => {
          if (tb.id === 'basic') {
            tabs.push({ shortLabel: '基', title: '基本排版', ids: ['basic'], defaultId: 'basic' });
          } else if (tb.id === 'zhPunct' || tb.id === 'enPunct') {
            if (!punctAdded) {
              tabs.push({
                shortLabel: '標',
                title: '標點符號（預設中文，可切換英文）',
                ids: ['zhPunct', 'enPunct'],
                defaultId: punctDefaultId
              });
              punctAdded = true;
            }
          } else if (tb.id === 'otherSymbols') {
            tabs.push({ shortLabel: '他', title: '其他符號', ids: ['otherSymbols'], defaultId: 'otherSymbols' });
          } else if (tb.id === 'bopomofo') {
            tabs.push({ shortLabel: '注', title: '注音符號', ids: ['bopomofo'], defaultId: 'bopomofo' });
          }
        });

        return tabs;
      }

      function renderToolbars() {
        toolbarsContainer.innerHTML = '';
        Object.keys(basicControlRefs).forEach((k) => delete basicControlRefs[k]);

        const toolbarsToRender = currentResolvedMobile
          ? config.toolbars
          : config.toolbars.filter((tb) => tb.enabled);

        toolbarsContainer.classList.toggle('mobile-collapsed', Boolean(currentResolvedMobile && mobileToolbarCollapsed));

        if (currentResolvedMobile) {
          const mobileTabs = buildMobileTabDefs();
          const mobileHeader = document.createElement('div');
          mobileHeader.className = 'mobile-toolbar-header';

          const tabsWrap = document.createElement('div');
          tabsWrap.className = 'mobile-tb-tabs';

          mobileTabs.forEach((tab) => {
            const tabBtn = document.createElement('button');
            tabBtn.type = 'button';
            const isThisGroup = tab.ids.includes(mobileActiveToolbarId);
            const isActive = !mobileToolbarCollapsed && isThisGroup;
            tabBtn.className = 'mobile-tb-tab' + (isActive ? ' active' : '');
            tabBtn.textContent = tab.shortLabel;
            tabBtn.title = tab.title;
            tabBtn.addEventListener('click', () => {
              if (isThisGroup) {
                mobileToolbarCollapsed = !mobileToolbarCollapsed;
              } else {
                mobileActiveToolbarId = tab.defaultId;
                mobileToolbarCollapsed = false;
              }
              renderToolbars();
            });
            tabsWrap.appendChild(tabBtn);
          });

          const actionsWrap = document.createElement('div');
          actionsWrap.className = 'mobile-header-actions';

          const toggleBtn = document.createElement('button');
          toggleBtn.type = 'button';
          toggleBtn.className = 'tb-btn';
          toggleBtn.title = mobileToolbarCollapsed ? '展開工具列' : '收合工具列';
          toggleBtn.textContent = mobileToolbarCollapsed ? '▾' : '▴';
          toggleBtn.addEventListener('click', () => {
            mobileToolbarCollapsed = !mobileToolbarCollapsed;
            renderToolbars();
          });
          actionsWrap.appendChild(toggleBtn);

          actionsWrap.appendChild(createSettingsButton());
          mobileHeader.appendChild(tabsWrap);
          mobileHeader.appendChild(actionsWrap);
          toolbarsContainer.appendChild(mobileHeader);
        }

        let settingsBtnPlaced = currentResolvedMobile;

        toolbarsToRender.forEach((tb) => {
          let row = null;

          if (tb.id === 'basic') {
            row = document.createElement('div');
            row.className = 'toolbar-row';
            row.dataset.toolbarId = 'basic';

            config.basicItems.forEach((item) => {
              if (!item.enabled) return;
              row.appendChild(createBasicItemElement(item.id));
            });

            if (!settingsBtnPlaced) {
              const spacer = document.createElement('div');
              spacer.className = 'toolbar-spacer';
              row.appendChild(spacer);
              row.appendChild(createSettingsButton());
              settingsBtnPlaced = true;
            }
          } else if (tb.id === 'zhPunct') {
            row = renderSymbolRow('zhPunct', '中文標點', config.zhPunctItems, {
              to: 'enPunct',
              btnText: '切換英文標點'
            });
          } else if (tb.id === 'enPunct') {
            row = renderSymbolRow('enPunct', '英文標點', config.enPunctItems, {
              to: 'zhPunct',
              btnText: '切換中文標點'
            });
          } else if (tb.id === 'otherSymbols') {
            row = renderSymbolRow('otherSymbols', '其他符號', config.otherSymbolsItems);
          } else if (tb.id === 'bopomofo') {
            row = renderSymbolRow('bopomofo', '注音符號', config.bopomofoItems);
          }

          if (row) {
            if (currentResolvedMobile && !mobileToolbarCollapsed && tb.id === mobileActiveToolbarId) {
              row.classList.add('mobile-active');
            }
            toolbarsContainer.appendChild(row);
          }
        });

        // If user hid all toolbars or basic toolbar on desktop, ensure settings button is still reachable
        if (!settingsBtnPlaced) {
          const fallbackRow = document.createElement('div');
          fallbackRow.className = 'toolbar-row';
          const spacer = document.createElement('div');
          spacer.className = 'toolbar-spacer';
          fallbackRow.appendChild(spacer);
          fallbackRow.appendChild(createSettingsButton());
          toolbarsContainer.appendChild(fallbackRow);
        }

        renderMobileBottomBar();
        updateToolbarActiveStates();
        notifyHeight();
      }

      function createSettingsButton() {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tb-btn';
        btn.title = '設定與自訂工具列';
        btn.innerHTML = ICONS.settings;
        btn.addEventListener('click', openSettingsModal);
        return btn;
      }

      // =========================================================================
      // 10. Settings Modal (Theme, Toolbar Order/Visibility, Tabbed Item Customizer)
      // =========================================================================
      const settingsModal = document.getElementById('settingsModal');
      const settingsTabs = document.getElementById('settingsTabs');
      const settingsModalBody = document.getElementById('settingsModalBody');
      const toolbarOrderList = document.getElementById('toolbarOrderList');
      const toolbarPanelRefs = {};
      let activeSettingsTab = 'general';

      function setActiveSettingsTab(tabId) {
        activeSettingsTab = tabId;
        settingsTabs.querySelectorAll('.modal-tab-btn').forEach((btn) => {
          const isActive = btn.dataset.settingsTab === tabId;
          btn.classList.toggle('active', isActive);
          btn.setAttribute('aria-selected', isActive ? 'true' : 'false');
        });
        settingsModalBody.querySelectorAll('.tab-panel').forEach((panel) => {
          panel.classList.toggle('active', panel.dataset.tabPanel === tabId);
        });
      }

      function initSettingsTabs() {
        settingsTabs.addEventListener('click', (e) => {
          const btn = e.target.closest('.modal-tab-btn');
          if (!btn) return;
          setActiveSettingsTab(btn.dataset.settingsTab);
        });

        TOOLBAR_ITEM_SCHEMAS.forEach((schema) => {
          const meta = TOOLBAR_META[schema.id];

          const tabBtn = document.createElement('button');
          tabBtn.type = 'button';
          tabBtn.className = 'modal-tab-btn';
          tabBtn.setAttribute('role', 'tab');
          tabBtn.setAttribute('aria-selected', 'false');
          tabBtn.dataset.settingsTab = schema.id;
          tabBtn.textContent = meta.tabLabel || meta.label;
          settingsTabs.appendChild(tabBtn);

          const panel = document.createElement('div');
          panel.className = 'tab-panel';
          panel.setAttribute('role', 'tabpanel');
          panel.dataset.tabPanel = schema.id;

          const notice = document.createElement('div');
          notice.className = 'toolbar-hidden-notice';
          notice.style.display = 'none';

          const noticeText = document.createElement('span');
          noticeText.textContent = `「${meta.label}」目前未顯示，可至「一般設定」或點擊右側按鈕啟用。`;

          const enableBtn = document.createElement('button');
          enableBtn.type = 'button';
          enableBtn.className = 'mini-btn';
          enableBtn.textContent = '立即啟用';
          enableBtn.addEventListener('click', () => {
            const tb = config.toolbars.find((t) => t.id === schema.id);
            if (tb) tb.enabled = true;
            saveConfig();
            renderToolbars();
            renderSettingsLists();
            showToast(`已啟用${meta.label}`);
          });

          notice.appendChild(noticeText);
          notice.appendChild(enableBtn);
          panel.appendChild(notice);

          const section = document.createElement('div');
          section.className = 'setting-section';

          const headerRow = document.createElement('div');
          headerRow.className = 'section-header-row';

          const heading = document.createElement('h4');
          heading.textContent = `${meta.label}按鈕自訂（勾選顯示與排序）`;

          const actions = document.createElement('div');
          actions.className = 'section-actions';

          const selectAllBtn = document.createElement('button');
          selectAllBtn.type = 'button';
          selectAllBtn.className = 'mini-btn';
          selectAllBtn.textContent = '全選';
          selectAllBtn.addEventListener('click', () => {
            config[schema.configKey].forEach((item) => {
              item.enabled = true;
            });
            saveConfig();
            renderToolbars();
            renderSettingsLists();
          });

          const clearAllBtn = document.createElement('button');
          clearAllBtn.type = 'button';
          clearAllBtn.className = 'mini-btn';
          clearAllBtn.textContent = '全不選';
          clearAllBtn.addEventListener('click', () => {
            config[schema.configKey].forEach((item) => {
              item.enabled = false;
            });
            saveConfig();
            renderToolbars();
            renderSettingsLists();
          });

          const resetTabBtn = document.createElement('button');
          resetTabBtn.type = 'button';
          resetTabBtn.className = 'mini-btn';
          resetTabBtn.textContent = '還原預設';
          resetTabBtn.addEventListener('click', () => {
            config[schema.configKey] = DEFAULT_CONFIG[schema.configKey].map((item) => ({ ...item }));
            saveConfig();
            renderToolbars();
            renderSettingsLists();
            showToast(`已還原${meta.label}按鈕預設設定`);
          });

          actions.appendChild(selectAllBtn);
          actions.appendChild(clearAllBtn);
          actions.appendChild(resetTabBtn);

          headerRow.appendChild(heading);
          headerRow.appendChild(actions);

          const grid = document.createElement('div');
          grid.className = schema.isSymbol ? 'sortable-grid symbol-grid' : 'sortable-grid';

          section.appendChild(headerRow);
          section.appendChild(grid);
          panel.appendChild(section);
          settingsModalBody.appendChild(panel);

          toolbarPanelRefs[schema.id] = { notice, grid };
        });
      }

      initSettingsTabs();

      function openSettingsModal() {
        renderSettingsLists();
        setActiveSettingsTab(activeSettingsTab);
        settingsModal.classList.add('open');
      }

      function closeSettingsModal() {
        settingsModal.classList.remove('open');
      }

      document.getElementById('closeSettingsBtn').addEventListener('click', closeSettingsModal);
      document.getElementById('doneSettingsBtn').addEventListener('click', closeSettingsModal);
      settingsModal.addEventListener('click', (e) => {
        if (e.target === settingsModal) closeSettingsModal();
      });

      document.getElementById('themeOptions').addEventListener('click', (e) => {
        const card = e.target.closest('.theme-card');
        if (!card) return;
        config.theme = card.dataset.themeVal;
        applyTheme(config.theme);
        saveConfig();
      });

      document.getElementById('layoutOptions').addEventListener('click', (e) => {
        const card = e.target.closest('.theme-card');
        if (!card) return;
        config.layoutMode = card.dataset.layoutVal;
        saveConfig();
        applyLayout(true);
      });

      window.addEventListener('resize', () => {
        if (config.layoutMode === 'auto') {
          applyLayout(true);
        }
      });

      document.getElementById('resetSettingsBtn').addEventListener('click', () => {
        config = cloneDefaultConfig();
        applyTheme(config.theme);
        applyLayout(false);
        saveConfig();
        renderToolbars();
        renderSettingsLists();
        showToast('已復原為預設工具列與外觀設定');
      });

      function buildSortableList(container, items, metaMap, onUpdate, options = {}) {
        container.innerHTML = '';
        let dragSrcIndex = null;

        items.forEach((item, idx) => {
          const row = document.createElement('div');
          row.className = 'sortable-item';
          row.draggable = true;

          const left = document.createElement('label');
          left.className = 'sortable-left';

          const handle = document.createElement('span');
          handle.className = 'drag-handle';
          handle.textContent = '⋮⋮';

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.checked = item.enabled;
          cb.addEventListener('change', () => {
            item.enabled = cb.checked;
            onUpdate();
          });

          const text = document.createElement('span');
          if (options.isSymbol) {
            text.className = 'sym-preview';
          }
          text.textContent = metaMap && metaMap[item.id] ? metaMap[item.id].label : item.id;

          left.appendChild(handle);
          left.appendChild(cb);
          left.appendChild(text);

          const arrows = document.createElement('div');
          arrows.className = 'sort-arrows';

          const upBtn = document.createElement('button');
          upBtn.type = 'button';
          upBtn.className = 'mini-btn';
          upBtn.textContent = '↑';
          upBtn.disabled = idx === 0;
          upBtn.addEventListener('click', () => {
            if (idx === 0) return;
            [items[idx - 1], items[idx]] = [items[idx], items[idx - 1]];
            onUpdate();
            renderSettingsLists();
          });

          const downBtn = document.createElement('button');
          downBtn.type = 'button';
          downBtn.className = 'mini-btn';
          downBtn.textContent = '↓';
          downBtn.disabled = idx === items.length - 1;
          downBtn.addEventListener('click', () => {
            if (idx === items.length - 1) return;
            [items[idx + 1], items[idx]] = [items[idx], items[idx + 1]];
            onUpdate();
            renderSettingsLists();
          });

          arrows.appendChild(upBtn);
          arrows.appendChild(downBtn);

          row.addEventListener('dragstart', () => {
            dragSrcIndex = idx;
            row.classList.add('dragging');
          });
          row.addEventListener('dragend', () => {
            row.classList.remove('dragging');
          });
          row.addEventListener('dragover', (e) => {
            e.preventDefault();
          });
          row.addEventListener('drop', (e) => {
            e.preventDefault();
            if (dragSrcIndex === null || dragSrcIndex === idx) return;
            const moved = items.splice(dragSrcIndex, 1)[0];
            items.splice(idx, 0, moved);
            dragSrcIndex = null;
            onUpdate();
            renderSettingsLists();
          });

          row.appendChild(left);
          row.appendChild(arrows);
          container.appendChild(row);
        });
      }

      function updateToolbarHiddenNotices() {
        TOOLBAR_ITEM_SCHEMAS.forEach((schema) => {
          const refs = toolbarPanelRefs[schema.id];
          if (!refs) return;
          const tb = config.toolbars.find((t) => t.id === schema.id);
          refs.notice.style.display = tb && tb.enabled ? 'none' : 'flex';
        });
      }

      function renderSettingsLists() {
        buildSortableList(toolbarOrderList, config.toolbars, TOOLBAR_META, () => {
          saveConfig();
          renderToolbars();
          updateToolbarHiddenNotices();
        });

        TOOLBAR_ITEM_SCHEMAS.forEach((schema) => {
          const refs = toolbarPanelRefs[schema.id];
          if (!refs) return;
          buildSortableList(
            refs.grid,
            config[schema.configKey],
            schema.meta,
            () => {
              saveConfig();
              renderToolbars();
            },
            { isSymbol: schema.isSymbol }
          );
        });

        updateToolbarHiddenNotices();
      }

      // =========================================================================
      // 11. window.postMessage Communication Interface (for <iframe> embedding)
      // =========================================================================
      let changeTimer = null;
      let lastNotifiedHeight = 0;

      function postToParent(payload) {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      }

      function notifyHeight() {
        const height = Math.ceil(document.getElementById('editorShell').getBoundingClientRect().height);
        if (height > 0 && height !== lastNotifiedHeight) {
          lastNotifiedHeight = height;
          postToParent({ type: 'editor:resize', height });
        }
      }

      function emitContentChange() {
        postToParent({
          type: 'editor:change',
          html: getRichHtmlContent(),
          text: getPlainTextContent(),
          markdown: getMarkdownContent()
        });
      }

      quill.on('text-change', (_delta, _oldDelta, source) => {
        updateToolbarActiveStates();
        notifyHeight();
        if (source === 'user') {
          clearTimeout(changeTimer);
          changeTimer = setTimeout(emitContentChange, 150);
        }
      });

      quill.on('selection-change', () => {
        updateToolbarActiveStates();
      });

      // Observe layout size changes for automatic iframe height sync
      if (typeof ResizeObserver !== 'undefined') {
        const ro = new ResizeObserver(() => {
          notifyHeight();
        });
        ro.observe(document.getElementById('editorShell'));
      }

      window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data || typeof data !== 'object' || typeof data.type !== 'string') return;

        switch (data.type) {
          case 'editor:setContent': {
            const format = data.format === 'text' ? 'text' : 'html';
            const content = typeof data.content === 'string' ? data.content : '';
            if (format === 'text') {
              quill.setText(content, 'silent');
            } else {
              quill.clipboard.dangerouslyPasteHTML(content, 'silent');
            }
            notifyHeight();
            break;
          }
          case 'editor:getContent': {
            const target = event.source || window.parent;
            if (target && target !== window) {
              target.postMessage(
                {
                  type: 'editor:content',
                  requestId: data.requestId || null,
                  html: getRichHtmlContent(),
                  text: getPlainTextContent(),
                  markdown: getMarkdownContent()
                },
                '*'
              );
            }
            break;
          }
          case 'editor:setTheme': {
            if (['light', 'dark', 'eyecare'].includes(data.theme)) {
              config.theme = data.theme;
              applyTheme(config.theme);
              saveConfig();
            }
            break;
          }
          case 'editor:setConfig': {
            if (typeof data.readOnly === 'boolean') {
              quill.enable(!data.readOnly);
            }
            if (typeof data.placeholder === 'string') {
              quill.root.setAttribute('data-placeholder', data.placeholder);
            }
            if (['auto', 'desktop', 'mobile'].includes(data.layoutMode)) {
              config.layoutMode = data.layoutMode;
              saveConfig();
              applyLayout(true);
            }
            break;
          }
          case 'editor:focus': {
            quill.focus();
            break;
          }
        }
      });

      // =========================================================================
      // 12. Initial Render & Ready Signal
      // =========================================================================
      renderToolbars();
      notifyHeight();
      postToParent({ type: 'editor:ready' });
    })();
  </script>
</body>
