<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlugEditor — iframe 雙向通訊示範</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      line-height: 1.5;
    }
    .container {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: 1.35rem;
    }
    .header-links a {
      color: #2563eb;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .header-links a:hover { text-decoration: underline; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      align-items: center;
    }
    .controls button, .controls select {
      padding: 6px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #f8fafc;
      color: #1e293b;
      font-size: 0.875rem;
      cursor: pointer;
    }
    .controls button:hover {
      background: #e2e8f0;
    }
    .status-badge {
      margin-left: auto;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      font-weight: 500;
    }
    .status-badge.ready {
      background: #dcfce7;
      color: #166534;
    }
    iframe {
      width: 100%;
      min-height: 360px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: #ffffff;
      display: block;
    }
    .output-panel {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      overflow: hidden;
    }
    .tabs {
      display: flex;
      background: #f8fafc;
      border-bottom: 1px solid #cbd5e1;
    }
    .tabs button {
      padding: 8px 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      color: #475569;
    }
    .tabs button.active {
      background: #ffffff;
      color: #2563eb;
      border-bottom: 2px solid #2563eb;
    }
    pre {
      margin: 0;
      padding: 14px;
      max-height: 260px;
      overflow: auto;
      font-size: 0.82rem;
      background: #0f172a;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>PlugEditor — <code>&lt;iframe&gt;</code> 雙向通訊示範</h1>
      <div class="header-links">
        <a href="editor.html" target="_blank" rel="noopener">單獨開啟 editor.html ↗</a>
      </div>
    </header>

    <div class="controls">
      <button type="button" id="btnSetSample">寫入範例內容</button>
      <button type="button" id="btnGetContent">主動取得內容</button>
      <button type="button" id="btnFocus">聚焦編輯器</button>
      <button type="button" id="btnToggleReadOnly">切換唯讀 (目前: 否)</button>
      <label>
        主題：
        <select id="themeSelect">
          <option value="light">白天 (light)</option>
          <option value="dark">黑夜 (dark)</option>
          <option value="eyecare">護眼 (eyecare)</option>
        </select>
      </label>
      <span id="statusBadge" class="status-badge">等待 editor:ready...</span>
    </div>

    <iframe id="editorFrame" src="editor.html" title="PlugEditor"></iframe>

    <div class="output-panel">
      <div class="tabs">
        <button type="button" class="active" data-tab="html">HTML（相容 Word）</button>
        <button type="button" data-tab="text">純文字</button>
        <button type="button" data-tab="markdown">Markdown</button>
      </div>
      <pre id="outputPreview">(尚未收到編輯器內容)</pre>
    </div>
  </div>

  <script>
    const frame = document.getElementById('editorFrame');
    const statusBadge = document.getElementById('statusBadge');
    const outputPreview = document.getElementById('outputPreview');
    const btnToggleReadOnly = document.getElementById('btnToggleReadOnly');

    let isReadOnly = false;
    let activeTab = 'html';
    const latestData = { html: '', text: '', markdown: '' };

    function sendToEditor(message) {
      frame.contentWindow.postMessage(message, '*');
    }

    function renderOutput() {
      outputPreview.textContent = latestData[activeTab] || '(空內容)';
    }

    window.addEventListener('message', (event) => {
      if (event.source !== frame.contentWindow) return;
      const data = event.data;
      if (!data || typeof data.type !== 'string') return;

      switch (data.type) {
        case 'editor:ready':
          statusBadge.textContent = '已就緒 (editor:ready)';
          statusBadge.classList.add('ready');
          sendToEditor({
            type: 'editor:setContent',
            format: 'html',
            content: '<p><strong>歡迎使用 PlugEditor！</strong></p><p>此頁面示範如何透過 <code>window.postMessage</code> 控制編輯器。</p>'
          });
          sendToEditor({ type: 'editor:getContent', requestId: 'init' });
          break;

        case 'editor:resize':
          if (typeof data.height === 'number') {
            frame.style.height = `${Math.max(360, data.height)}px`;
          }
          break;

        case 'editor:change':
        case 'editor:content':
          latestData.html = data.html || '';
          latestData.text = data.text || '';
          latestData.markdown = data.markdown || '';
          renderOutput();
          break;
      }
    });

    document.getElementById('btnSetSample').addEventListener('click', () => {
      sendToEditor({
        type: 'editor:setContent',
        format: 'html',
        content: '<p>範例標題</p><ol><li>第一項</li><li class="ql-indent-1">子項目</li></ol>'
      });
      sendToEditor({ type: 'editor:getContent', requestId: 'sample' });
    });

    document.getElementById('btnGetContent').addEventListener('click', () => {
      sendToEditor({ type: 'editor:getContent', requestId: String(Date.now()) });
    });

    document.getElementById('btnFocus').addEventListener('click', () => {
      sendToEditor({ type: 'editor:focus' });
    });

    btnToggleReadOnly.addEventListener('click', () => {
      isReadOnly = !isReadOnly;
      btnToggleReadOnly.textContent = `切換唯讀 (目前: ${isReadOnly ? '是' : '否'})`;
      sendToEditor({ type: 'editor:setConfig', readOnly: isReadOnly });
    });

    document.getElementById('themeSelect').addEventListener('change', (e) => {
      sendToEditor({ type: 'editor:setTheme', theme: e.target.value });
    });

    document.querySelectorAll('.tabs button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tabs button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        renderOutput();
      });
    });
  </script>
</body>
</html>
